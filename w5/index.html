<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端心電感應 ☕ Telepathy Game</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts 休閒輕鬆圓體 (支援繁體中文與英文) -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Quicksand', 'Zen Maru Gothic', sans-serif;
      background-color: #FAF7F2;
      letter-spacing: 0.02em;
    }
    
    /* 3D 卡片翻轉動畫 */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    .card-inner {
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card-flipped .card-inner {
      transform: rotateY(180deg);
    }

    /* 悠閒微風漂浮動畫 */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1.5deg); }
    }
    .animate-float-slow {
      animation: floatSlow 6s ease-in-out infinite;
    }
    
    /* 休閒質感卡片圓角與柔和陰影 */
    .chill-card {
      border-radius: 1.75rem;
      box-shadow: 0 12px 30px -8px rgba(87, 83, 78, 0.1), 0 4px 12px -4px rgba(107, 144, 128, 0.08);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#FAF7F2] via-[#F2EFE9] to-[#E4EDE8] text-stone-700 flex flex-col justify-between relative overflow-x-hidden">

  <!-- 背景氛圍裝飾光暈 (燕麥奶與鼠尾草綠) -->
  <div class="fixed top-10 left-10 w-40 h-40 bg-emerald-200/30 rounded-full blur-2xl pointer-events-none animate-float-slow"></div>
  <div class="fixed bottom-14 right-12 w-52 h-52 bg-amber-200/30 rounded-full blur-3xl pointer-events-none animate-float-slow" style="animation-delay: 2.5s;"></div>

  <!-- 頂部導覽列 -->
  <header class="p-4 md:p-6 flex justify-between items-center z-10 max-w-5xl mx-auto w-full">
    <div class="flex items-center space-x-2.5">
      <span class="text-3xl">☕</span>
      <h1 class="text-2xl md:text-3xl font-bold text-teal-800 tracking-wide">雲端心電感應</h1>
    </div>
    
    <div id="roomBadge" class="hidden flex items-center gap-2">
      <div class="bg-white/85 backdrop-blur border border-stone-200 px-4 py-2 rounded-full font-bold text-stone-600 shadow-sm flex items-center gap-2">
        <span>房號：<span id="displayRoomId" class="text-teal-700">--</span></span>
        <span id="hostBadge" class="hidden bg-teal-600 text-white text-xs px-2.5 py-0.5 rounded-full">房主</span>
      </div>
      <button onclick="toggleHostConsole()" class="bg-white/85 hover:bg-white backdrop-blur border border-stone-200 px-3.5 py-2 rounded-full font-bold text-stone-600 hover:text-teal-700 shadow-sm transition text-sm flex items-center gap-1" title="更換題目或重置房間">
        <span>⚙️</span>
        <span class="hidden sm:inline">換題/重置</span>
      </button>
    </div>
  </header>

  <!-- 主內容視圖區 -->
  <main class="container mx-auto px-4 py-6 max-w-4xl flex-grow flex flex-col justify-center items-center z-10">

    <!-- 頁面 1: 登入 / 選擇與建立房間 -->
    <div id="viewLogin" class="w-full max-w-md bg-white/85 backdrop-blur-md chill-card p-8 text-center border border-stone-200/80 animate-float-slow">
      <div class="text-5xl mb-3">🌤️</div>
      <h2 class="text-2xl font-bold text-stone-700 mb-6">輕鬆加入遊戲房間</h2>
      
      <div class="space-y-4 text-left">
        <div>
          <label class="block text-sm font-bold text-stone-500 mb-1.5 ml-2">玩家暱稱</label>
          <input type="text" id="inputPlayerName" placeholder="輸入你的暱稱..." class="w-full px-5 py-3 rounded-2xl border border-stone-200 focus:border-teal-500 focus:outline-none text-stone-700 bg-[#FAF7F2]/80 font-medium transition">
        </div>
        
        <div>
          <label class="block text-sm font-bold text-stone-500 mb-1.5 ml-2">房間號碼 (自由分組)</label>
          <div class="flex gap-2">
            <input type="text" id="inputRoomId" onkeydown="if(event.key==='Enter') joinRoom()" placeholder="例如: 888" class="w-full px-5 py-3 rounded-2xl border border-stone-200 focus:border-teal-500 focus:outline-none text-stone-700 bg-[#FAF7F2]/80 font-medium transition">
            <button onclick="generateRandomRoom()" class="px-4 py-3 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold rounded-2xl transition whitespace-nowrap">隨機房號</button>
          </div>
        </div>
      </div>

      <button onclick="joinRoom()" class="mt-8 w-full py-4 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white font-bold text-lg rounded-2xl shadow-md transform active:scale-95 transition">
        進入房間 🌿
      </button>
    </div>

    <!-- 頁面 2: 遊戲互動主介面 -->
    <div id="viewGame" class="hidden w-full flex flex-col items-center gap-6">

      <!-- 題目顯示區 -->
      <div class="w-full bg-white/85 backdrop-blur-md chill-card p-6 border border-stone-200/80 text-center relative">
        <span class="text-xs font-bold text-teal-700 uppercase tracking-widest bg-teal-50 border border-teal-200/70 px-3.5 py-1 rounded-full">Current Topic</span>
        <h2 id="questionTitle" class="text-2xl md:text-3xl font-bold text-stone-700 mt-3 min-h-[40px] flex items-center justify-center">
          你喜歡喝什麼？
        </h2>
      </div>

      <!-- 玩家多欄位填答輸入區 + 翻牌看答案按鈕 -->
      <div id="answerSection" class="w-full max-w-lg bg-white/85 backdrop-blur-md chill-card p-6 border border-stone-200/80 text-center">
        <div class="flex items-center justify-between mb-3 px-1">
          <h3 class="text-lg font-bold text-stone-600">寫下你的答案 💭</h3>
          <button type="button" onclick="addAnswerField()" class="text-xs font-bold text-teal-700 bg-teal-50 hover:bg-teal-100 border border-teal-200/80 px-3 py-1.5 rounded-full transition active:scale-95">
            + 新增答案欄位
          </button>
        </div>
        
        <!-- 多個答案輸入框容器 -->
        <div id="answerInputsList" class="space-y-2.5 text-left">
          <div class="answer-input-row flex items-center gap-2">
            <span class="text-xs font-bold text-teal-700 bg-teal-50 border border-teal-200/70 px-2.5 py-2 rounded-xl whitespace-nowrap">答案 1</span>
            <input type="text" onkeydown="if(event.key==='Enter') submitAnswer()" placeholder="輸入第 1 個答案..." class="answer-input w-full px-4 py-2.5 rounded-2xl border border-stone-200 focus:border-teal-500 focus:outline-none text-stone-700 bg-[#FAF7F2]/80 font-medium transition">
          </div>

          <div class="answer-input-row flex items-center gap-2">
            <span class="text-xs font-bold text-teal-700 bg-teal-50 border border-teal-200/70 px-2.5 py-2 rounded-xl whitespace-nowrap">答案 2</span>
            <input type="text" onkeydown="if(event.key==='Enter') submitAnswer()" placeholder="輸入第 2 個答案..." class="answer-input w-full px-4 py-2.5 rounded-2xl border border-stone-200 focus:border-teal-500 focus:outline-none text-stone-700 bg-[#FAF7F2]/80 font-medium transition">
            <button type="button" onclick="removeAnswerField(this)" class="px-2.5 py-2 text-stone-400 hover:text-rose-500 font-bold rounded-xl transition" title="刪除此欄位">✕</button>
          </div>
        </div>

        <!-- 送出答案與翻牌看答案按鈕區 -->
        <div class="mt-4 pt-4 border-t border-stone-200/80 flex flex-col sm:flex-row items-center justify-center gap-3">
          <button onclick="submitAnswer()" class="w-full sm:flex-1 py-3 px-6 bg-teal-600 hover:bg-teal-700 text-white font-bold text-base rounded-2xl transition shadow-sm whitespace-nowrap active:scale-95">
            送出答案 ✨
          </button>

          <button id="btnFlipAnswers" onclick="toggleFlipAllAnswers()" class="w-full sm:flex-1 py-3 px-6 rounded-2xl text-base font-bold bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-500 hover:to-orange-500 text-white shadow-md transition transform active:scale-95 flex items-center justify-center gap-2">
            <span>🃏</span>
            <span>翻牌看答案</span>
          </button>
        </div>

        <p id="submitStatus" class="text-xs font-bold text-teal-600 mt-2.5 min-h-[16px]"></p>
      </div>

      <!-- 玩家卡片展出區 -->
      <div class="w-full">
        <div class="flex items-center justify-center gap-2 mb-4">
          <h3 class="text-lg font-bold text-stone-600 flex items-center gap-2">
            <span>🌿</span> 玩家心電卡片 <span>🌿</span>
          </h3>
          <span class="text-xs text-stone-400 font-medium">(也可點擊單張卡片翻面)</span>
        </div>

        <div id="cardsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
          <!-- 卡片動態渲染於此 -->
        </div>
      </div>

    </div>

  </main>

  <!-- 頁尾與控制台按鈕 -->
  <footer class="p-4 text-center text-stone-400 text-sm font-medium flex justify-between items-center max-w-4xl mx-auto w-full">
    <span>🌿 Cloud Telepathy Game</span>
    <button onclick="toggleHostConsole()" class="opacity-50 hover:opacity-100 transition-opacity text-xl p-2" title="更換題目或重置房間">
      🪴
    </button>
  </footer>

  <!-- 房主換題/重置控制台 Modal -->
  <div id="hostModal" class="hidden fixed inset-0 bg-stone-900/35 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[#FAF7F2] chill-card border border-stone-200 p-6 w-full max-w-lg shadow-xl relative">
      <button onclick="toggleHostConsole()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-600 font-bold text-xl">✕</button>
      
      <div class="flex items-center gap-2 mb-4">
        <span class="text-2xl">🎧</span>
        <h3 class="text-xl font-bold text-stone-700">房間設定控制台</h3>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-bold text-stone-500 mb-1.5">更換新題目</label>
          <div class="flex gap-2">
            <input type="text" id="hostQuestionInput" onkeydown="if(event.key==='Enter') hostSetQuestion()" placeholder="例如：你喜歡喝什麼？" class="w-full px-4 py-2.5 rounded-xl border border-stone-200 bg-white focus:border-teal-500 focus:outline-none text-stone-700">
            <button onclick="hostSetQuestion()" class="px-4 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl transition whitespace-nowrap">
              發布題目
            </button>
          </div>
        </div>

        <hr class="border-stone-200">

        <div class="flex gap-3">
          <button onclick="hostReveal()" class="flex-1 py-3 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white font-bold rounded-xl shadow-sm transition transform active:scale-95 flex items-center justify-center gap-2">
            <span>✨</span> 全網頁同步翻牌
          </button>
          <button onclick="hostReset()" class="px-4 py-3 bg-stone-200 hover:bg-stone-300 text-stone-600 font-bold rounded-xl transition">
            重置房間
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // === 核心變數設定 ===
    const SHEET_NAME = 'TelepathyData';
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyf0rHPnWr18cFk-n-aWFGI9cTJ5cuQQNygBDBeCJ5BjX8n1cmK_fU_ycEvAms5xShEeA/exec";
    const DEFAULT_QUESTION = "你喜歡喝什麼？";

    let gameState = {
      roomId: "default",
      playerName: "",
      isHost: false,
      status: "setup",
      question: DEFAULT_QUESTION,
      answers: {},
      allFlipped: false,
      singleCardFlips: {},
      lastServerStatus: "setup"
    };

    let pollingTimer = null;

    // 生成隨機房號
    function generateRandomRoom() {
      const roomNum = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('inputRoomId').value = roomNum;
    }

    // 新增答案輸入欄位
    function addAnswerField() {
      const container = document.getElementById('answerInputsList');
      const count = container.querySelectorAll('.answer-input-row').length + 1;
      const row = document.createElement('div');
      row.className = 'answer-input-row flex items-center gap-2';
      row.innerHTML = `
        <span class="text-xs font-bold text-teal-700 bg-teal-50 border border-teal-200/70 px-2.5 py-2 rounded-xl whitespace-nowrap">答案 ${count}</span>
        <input type="text" onkeydown="if(event.key==='Enter') submitAnswer()" placeholder="輸入第 ${count} 個答案..." class="answer-input w-full px-4 py-2.5 rounded-2xl border border-stone-200 focus:border-teal-500 focus:outline-none text-stone-700 bg-[#FAF7F2]/80 font-medium transition">
        <button type="button" onclick="removeAnswerField(this)" class="px-2.5 py-2 text-stone-400 hover:text-rose-500 font-bold rounded-xl transition" title="刪除此欄位">✕</button>
      `;
      container.appendChild(row);
      row.querySelector('input').focus();
    }

    // 刪除多餘的答案輸入欄位
    function removeAnswerField(btn) {
      const container = document.getElementById('answerInputsList');
      const rows = container.querySelectorAll('.answer-input-row');
      if (rows.length <= 1) return;
      btn.closest('.answer-input-row').remove();

      container.querySelectorAll('.answer-input-row').forEach((row, idx) => {
        const num = idx + 1;
        row.querySelector('span').innerText = `答案 ${num}`;
        row.querySelector('input').placeholder = `輸入第 ${num} 個答案...`;
      });
    }

    // 登入進入指定房間
    function joinRoom() {
      const name = document.getElementById('inputPlayerName').value.trim();
      const room = document.getElementById('inputRoomId').value.trim();

      if (!name || !room) {
        alert("請完整輸入暱稱與房間號碼！");
        return;
      }

      gameState.playerName = name;
      gameState.roomId = room;

      document.getElementById('viewLogin').classList.add('hidden');
      document.getElementById('viewGame').classList.remove('hidden');
      document.getElementById('roomBadge').classList.remove('hidden');
      document.getElementById('displayRoomId').innerText = gameState.roomId;

      startPolling();
    }

    // 輪詢 Polling 機制
    function startPolling() {
      fetchGameState();
      pollingTimer = setInterval(fetchGameState, 2000);
    }

    // 利用 fetch (GET) 抓取最新遊戲資料
    async function fetchGameState() {
      try {
        const response = await fetch(`${GAS_API_URL}?room=${encodeURIComponent(gameState.roomId)}`);
        const data = await response.json();
        updateUI(data);
      } catch (error) {
        console.error("輪詢資料抓取失敗:", error);
      }
    }

    // 更新前端 UI 狀態
    function updateUI(data) {
      const newStatus = data.status || "setup";
      const newQuestion = (data.question && data.question.trim()) ? data.question.trim() : DEFAULT_QUESTION;

      if (newStatus === "revealed" && gameState.lastServerStatus !== "revealed") {
        gameState.allFlipped = true;
        gameState.singleCardFlips = {};
      }
      if (newStatus === "setup" && gameState.lastServerStatus !== "setup") {
        gameState.allFlipped = false;
        gameState.singleCardFlips = {};
      }

      gameState.lastServerStatus = newStatus;
      gameState.status = newStatus;
      gameState.question = newQuestion;

      const serverAnswers = data.answers || {};
      gameState.answers = { ...gameState.answers, ...serverAnswers };
      if (Object.keys(serverAnswers).length === 0 && newStatus === "setup" && data.answers) {
        gameState.answers = {};
      }

      document.getElementById('questionTitle').innerText = gameState.question;

      updateFlipButtonUI();
      renderCards();
    }

    // 點擊「翻牌看答案 / 蓋上卡片」主按鈕
    function toggleFlipAllAnswers() {
      gameState.allFlipped = !gameState.allFlipped;
      gameState.singleCardFlips = {};
      updateFlipButtonUI();
      renderCards();

      if (gameState.allFlipped && gameState.status !== "revealed") {
        sendHostAction({ action: "reveal" });
      }
    }

    // 點擊單張卡片個別翻面
    function toggleSingleCard(playerName) {
      const currentFlipped = isCardFlipped(playerName);
      gameState.singleCardFlips[playerName] = !currentFlipped;
      renderCards();
    }

    // 判斷某張卡片目前是否為翻開狀態
    function isCardFlipped(playerName) {
      if (Object.prototype.hasOwnProperty.call(gameState.singleCardFlips, playerName)) {
        return gameState.singleCardFlips[playerName];
      }
      return gameState.allFlipped;
    }

    // 更新「翻牌看答案」按鈕文字與顏色
    function updateFlipButtonUI() {
      const btn = document.getElementById('btnFlipAnswers');
      if (!btn) return;

      if (gameState.allFlipped) {
        btn.innerHTML = `<span>🙈</span><span>蓋上卡片</span>`;
        btn.className = "w-full sm:flex-1 py-3 px-6 rounded-2xl text-base font-bold bg-stone-600 hover:bg-stone-700 text-white shadow-md transition transform active:scale-95 flex items-center justify-center gap-2";
      } else {
        btn.innerHTML = `<span>🃏</span><span>翻牌看答案</span>`;
        btn.className = "w-full sm:flex-1 py-3 px-6 rounded-2xl text-base font-bold bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-500 hover:to-orange-500 text-white shadow-md transition transform active:scale-95 flex items-center justify-center gap-2";
      }
    }

    // 動態繪製卡片 (3D CSS 翻轉效果)
    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      const playerNames = Object.keys(gameState.answers);

      if (playerNames.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-stone-400 py-8 font-medium">還沒有人送出答案喔，在上方輸入答案後就能翻牌查看 ☕</p>`;
        return;
      }

      grid.innerHTML = playerNames.map(name => {
        const rawAnswer = gameState.answers[name];
        const flipped = isCardFlipped(name);
        const flippedClass = flipped ? 'card-flipped' : '';
        const isMultiLine = String(rawAnswer).includes('\n');
        const textSizeClass = isMultiLine ? 'text-base leading-snug' : 'text-xl';

        return `
          <div data-player="${escapeHtml(name)}" onclick="toggleSingleCard(this.dataset.player)" class="perspective-1000 w-full h-44 cursor-pointer select-none ${flippedClass}" title="點擊翻開 / 蓋上卡片">
            <div class="card-inner relative w-full h-full transform-style-3d">
              
              <!-- 卡片背面 (蓋牌狀態 - 鼠尾草綠休閒風) -->
              <div class="absolute inset-0 w-full h-full bg-gradient-to-br from-[#7FA695] to-[#5E8675] rounded-2xl p-4 flex flex-col justify-between items-center text-white backface-hidden border border-white/60 shadow-sm hover:brightness-105 transition">
                <span class="text-xs font-bold bg-white/20 px-3 py-1 rounded-full">${escapeHtml(name)}</span>
                <div class="text-3xl">🎲</div>
                <span class="text-xs font-medium opacity-90">點擊翻開看答案</span>
              </div>

              <!-- 卡片正面 (翻開顯示答案 - 暖白茶韻風) -->
              <div class="absolute inset-0 w-full h-full bg-white rounded-2xl p-4 flex flex-col justify-between items-center text-stone-700 backface-hidden rotate-y-180 border-2 border-teal-200 shadow-sm overflow-y-auto">
                <span class="text-xs font-bold bg-teal-50 px-3 py-1 rounded-full text-teal-700 shrink-0">${escapeHtml(name)}</span>
                <div class="${textSizeClass} font-bold text-stone-700 text-center break-words whitespace-pre-line my-auto py-1">
                  ${escapeHtml(rawAnswer)}
                </div>
                <span class="text-xs font-medium text-stone-400 shrink-0">心有靈犀 ✨</span>
              </div>

            </div>
          </div>
        `;
      }).join('');
    }

    // 玩家送出多個答案
    async function submitAnswer() {
      const inputs = Array.from(document.querySelectorAll('#answerInputsList .answer-input'));
      const filledAnswers = inputs.map(inp => inp.value.trim()).filter(val => val !== "");
      const statusText = document.getElementById('submitStatus');

      if (filledAnswers.length === 0) {
        alert("請至少輸入一個答案！");
        return;
      }

      const combinedAnswer = filledAnswers.length === 1
        ? filledAnswers[0]
        : filledAnswers.map((ans, idx) => `${idx + 1}. ${ans}`).join('\n');

      gameState.answers[gameState.playerName] = combinedAnswer;
      renderCards();
      inputs.forEach(inp => inp.value = "");
      statusText.innerText = "傳送答案中...";

      try {
        await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            room: gameState.roomId,
            action: "submit_answer",
            playerName: gameState.playerName,
            answer: combinedAnswer
          })
        });

        statusText.innerText = "答案已送出！點擊「翻牌看答案」即可查看 ☕";
        fetchGameState();
      } catch (error) {
        console.error("提交答案失敗:", error);
        statusText.innerText = "已暫存於畫面，雲端同步稍有延遲";
      }
    }

    // === 房主控制台功能 ===
    function toggleHostConsole() {
      const modal = document.getElementById('hostModal');
      modal.classList.toggle('hidden');
      
      if (!gameState.isHost) {
        gameState.isHost = true;
        document.getElementById('hostBadge').classList.remove('hidden');
      }
    }

    // 發布題目
    async function hostSetQuestion() {
      const q = document.getElementById('hostQuestionInput').value.trim();
      if (!q) return alert("請輸入題目！");

      gameState.question = q;
      gameState.allFlipped = false;
      gameState.singleCardFlips = {};
      document.getElementById('questionTitle').innerText = q;
      updateFlipButtonUI();
      renderCards();

      await sendHostAction({
        action: "set_question",
        question: q
      });

      document.getElementById('hostQuestionInput').value = "";
      toggleHostConsole();
    }

    // 同步開牌
    async function hostReveal() {
      gameState.allFlipped = true;
      gameState.singleCardFlips = {};
      updateFlipButtonUI();
      renderCards();

      await sendHostAction({ action: "reveal" });
      toggleHostConsole();
    }

    // 重置房間狀態
    async function hostReset() {
      if (confirm("確定要重置目前房間嗎？")) {
        gameState.answers = {};
        gameState.allFlipped = false;
        gameState.singleCardFlips = {};
        updateFlipButtonUI();
        renderCards();

        await sendHostAction({ action: "reset" });
        toggleHostConsole();
      }
    }

    // 房主 API 請求
    async function sendHostAction(payload) {
      try {
        await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            room: gameState.roomId,
            ...payload
          })
        });
        fetchGameState();
      } catch (error) {
        console.error("房主操作失敗:", error);
      }
    }

    // 防範 HTML 注入
    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
