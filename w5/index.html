<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雲端心電感應 Telepathy</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{ --morandi-bg:#EDEAE3; --morandi-card:#F7F3EC; --morandi-green:#8FA998; --morandi-blue:#8AA2B8; --morandi-pink:#D9A8A0; --morandi-yellow:#D9C6A5; --morandi-text:#5A5A5A; }
  body{ background:var(--morandi-bg); color:var(--morandi-text); font-family:ui-rounded, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  .card3d{ perspective:1200px; }
  .card-inner{ transform-style:preserve-3d; transition:transform .9s cubic-bezier(.2,.8,.2,1); position:relative; width:100%; height:100%; }
  .card3d.flipped .card-inner{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:24px; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:16px; text-align:center; }
  .face.back{ transform:rotateY(180deg); }
  .hidden-host-btn{ position:fixed; right:12px; bottom:12px; width:28px; height:28px; border-radius:999px; background:transparent; color:transparent; cursor:pointer; z-index:50; }
  .hidden-host-btn:hover{ background:rgba(0,0,0,.05); }
  input,textarea,select{ outline:none; }
</style>
</head>
<body class="min-h-screen">
<div class="max-w-5xl mx-auto px-4 py-6">
  <header class="flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold tracking-wide">☁️ 雲端心電感應</h1>
      <p class="text-sm opacity-70 mt-1">多人默契遊戲 • 看看你們是不是心有靈犀</p>
    </div>
    <div id="roomBadge" class="hidden bg-white/70 px-4 py-2 rounded-full text-sm shadow">房號：<b id="roomCodeText"></b> • <span id="myNameText"></span></div>
  </header>

  <!-- 登入 / 開房 -->
  <section id="loginView" class="mt-6 bg-[#F7F3EC] rounded-[28px] p-6 shadow-sm">
    <h2 class="text-xl font-bold mb-4">加入遊戲</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white/70 rounded-2xl p-4">
        <label class="text-sm">你的暱稱</label>
        <input id="nickname" class="w-full mt-1 p-3 rounded-xl bg-[#EDEAE3]" placeholder="例如：小芸">
        <label class="text-sm block mt-4">房號 (4碼)</label>
        <input id="joinCode" class="w-full mt-1 p-3 rounded-xl bg-[#EDEAE3] tracking-[0.3em] text-center font-bold" placeholder="例如：A123" maxlength="4">
        <button onclick="joinRoom(false)" class="w-full mt-4 py-3 rounded-xl bg-[#8AA2B8] text-white font-bold">加入房間</button>
        <p class="text-xs mt-2 opacity-60">同學輸入房主給的房號就能進同一組。</p>
      </div>
      <div class="bg-[#8FA998]/20 rounded-2xl p-4">
        <h3 class="font-bold">我是房主</h3>
        <p class="text-sm mt-1 opacity-70">開房會自動產生房號，房主身分會隱藏，不會顯示在玩家列表。</p>
        <button onclick="createRoom()" class="w-full mt-4 py-3 rounded-xl bg-[#8FA998] text-white font-bold">＋ 建立新房間</button>
        <button onclick="joinRoom(true)" class="w-full mt-2 py-2 rounded-xl bg-white text-sm">我是房主，要重新進入</button>
        <div class="mt-3 text-xs bg-white/60 p-3 rounded-xl">房主小提示：進房後點右下角透明小圓點 → 開啟房主控制台。</div>
      </div>
    </div>
  </section>

  <!-- 遊戲區 -->
  <section id="gameView" class="hidden mt-6">
    <div class="bg-[#F7F3EC] rounded-[28px] p-5 shadow-sm">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-xs tracking-widest opacity-60">本題 QUESTION</p>
          <h2 id="questionText" class="text-2xl font-bold mt-1">等待房主出題...</h2>
        </div>
        <span id="statusPill" class="text-xs px-3 py-1 rounded-full bg-[#D9C6A5]">等待中</span>
      </div>
      <div class="mt-4 flex gap-2">
        <input id="answerInput" class="flex-1 p-3 rounded-xl bg-white" placeholder="寫下你的答案... 例如：珍珠奶茶">
        <button onclick="submitAnswer()" class="px-5 py-3 rounded-xl bg-[#D9A8A0] text-white font-bold">送出</button>
      </div>
      <p id="myAnswerHint" class="text-sm mt-2 opacity-70"></p>
    </div>

    <!-- 翻牌區 -->
    <div id="cardsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-5"></div>
    <p class="text-center text-sm mt-3 opacity-60">按下開牌時，全員同步翻牌 ✨</p>
  </section>
</div>

<!-- 隱藏房主控制台按鈕 -->
<button id="hostTrigger" class="hidden-host-btn" title="." onclick="toggleHostPanel()">.</button>

<!-- 房主控制台 -->
<div id="hostPanel" class="hidden fixed inset-0 bg-black/30 z-[60] flex items-end md:items-center justify-center p-4">
  <div class="bg-[#F7F3EC] w-full max-w-lg rounded-[24px] p-5">
    <div class="flex justify-between"><h3 class="font-bold text-lg">🎛️ 房主控制台 (只有房主看得到)</h3><button onclick="toggleHostPanel()">✕</button></div>
    <label class="text-sm block mt-4">出題</label>
    <input id="hostQuestion" class="w-full mt-1 p-3 rounded-xl bg-white" placeholder="例如：如果去旅行，最想去哪裡？">
    <div class="grid grid-cols-2 gap-2 mt-3">
      <button onclick="hostSetQuestion()" class="py-3 rounded-xl bg-[#8FA998] text-white font-bold">發布題目</button>
      <button onclick="hostReveal()" class="py-3 rounded-xl bg-[#8AA2B8] text-white font-bold">🃏 開牌！同步翻牌</button>
      <button onclick="hostResetRound()" class="py-3 rounded-xl bg-[#D9C6A5] font-bold">下一題 / 清空</button>
      <button onclick="copyRoomLink()" class="py-3 rounded-xl bg-white font-bold">複製房間連結</button>
    </div>
    <p class="text-xs mt-3 opacity-60">房主身份已隱藏，玩家列表不會顯示你是房主。輪詢：每 2.5 秒自動同步。</p>
  </div>
</div>

<script>
const SHEET_NAME = 'TelepathyData';
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyf0rHPnWr18cFk-n-aWFGI9cTJ5cuQQNygBDBeCJ5BjX8n1cmK_fU_ycEvAms5xShEeA/exec";

let state = { room:'', name:'', isHost:false, isRevealed:false, players:[] };
let pollTimer = null;

// GAS 串接 - 用 fetch，支援 GET 讀取 / POST 寫入
async function gas(action, payload={}){
  const url = GAS_API_URL + '?action=' + action + '&sheet=' + SHEET_NAME + '&room=' + encodeURIComponent(state.room) + '&data=' + encodeURIComponent(JSON.stringify(payload));
  // 優先用 GET 避免 CORS preflight，GAS 支援 doGet
  try{
    const res = await fetch(url);
    return await res.json();
  }catch(e){
    // fallback POST
    const res2 = await fetch(GAS_API_URL, { method:'POST', body: JSON.stringify({action, sheet:SHEET_NAME, room:state.room, ...payload}) });
    return await res2.json();
  }
}

function makeCode(){ const chars='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }

async function createRoom(){
  const name = document.getElementById('nickname').value.trim() || '房主';
  state.room = makeCode(); state.name = name; state.isHost = true;
  await gas('createRoom', { question:'', status:'waiting', revealed:false, hostName:name });
  enterGame();
  alert('房間建立成功！房號：' + state.room + '\n把房號給同學，他們輸入就能加入。');
}
async function joinRoom(asHost){
  const name = document.getElementById('nickname').value.trim();
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if(!name) return alert('請先輸入暱稱');
  if(!code && !asHost) return alert('請輸入房號');
  state.name = name; state.room = code || state.room; state.isHost = !!asHost;
  if(!state.room) return alert('請先建立房間或輸入房號');
  await gas('join', { name, isHost: state.isHost, answer:'', joinedAt: Date.now() });
  enterGame();
}
function enterGame(){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('gameView').classList.remove('hidden');
  document.getElementById('roomBadge').classList.remove('hidden');
  document.getElementById('roomCodeText').textContent = state.room;
  document.getElementById('myNameText').textContent = state.isHost ? state.name + ' (房主·已隱藏)' : state.name;
  // URL 帶房號，方便分享
  const u = new URL(location.href); u.searchParams.set('room', state.room); history.replaceState({},'',u);
  startPolling();
}
async function submitAnswer(){
  const v = document.getElementById('answerInput').value.trim();
  if(!v) return alert('請先寫答案');
  await gas('submit', { name: state.name, answer: v });
  document.getElementById('myAnswerHint').textContent = '已送出：' + v + '（等待開牌）';
  document.getElementById('answerInput').value = '';
}
function toggleHostPanel(){
  if(!state.isHost) return alert('這是房主專用控制台');
  document.getElementById('hostPanel').classList.toggle('hidden');
}
async function hostSetQuestion(){
  const q = document.getElementById('hostQuestion').value.trim();
  if(!q) return alert('請輸入題目');
  await gas('setQuestion', { question: q, status:'answering', revealed:false });
  document.getElementById('hostPanel').classList.add('hidden');
}
async function hostReveal(){ await gas('reveal', { revealed:true, status:'revealed' }); document.getElementById('hostPanel').classList.add('hidden'); }
async function hostResetRound(){ await gas('reset', { question:'', status:'waiting', revealed:false }); document.getElementById('hostPanel').classList.add('hidden'); }
function copyRoomLink(){
  const link = location.origin + location.pathname + '?room=' + state.room;
  navigator.clipboard.writeText(link + ' 房號：' + state.room);
  alert('已複製：' + link);
}

// 輪詢 Polling - 每 2.5 秒同步一次
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(sync, 2500);
  sync();
}
async function sync(){
  if(!state.room) return;
  const data = await gas('getState', {});
  // 預期 GAS 回傳：{ question, status, revealed, players:[{name, answer}] }
  if(!data) return;
  if(data.question) document.getElementById('questionText').textContent = data.question;
  document.getElementById('statusPill').textContent = data.status === 'revealed' ? '已開牌' : data.status === 'answering' ? '作答中' : '等待中';
  renderCards(data.players || [], !!data.revealed);
}
function renderCards(players, revealed){
  const grid = document.getElementById('cardsGrid');
  // 隱藏房主：過濾掉 isHost 的玩家，不顯示房主
  const showPlayers = players.filter(p => !p.isHost);
  // 如果沒有玩家資料，顯示自己當範例
  const list = showPlayers.length ? showPlayers : [{name: state.name, answer:'?'}];
  grid.innerHTML = list.map((p,i)=>{
    const colors = ['#8FA998','#8AA2B8','#D9A8A0','#D9C6A5'];
    const c = colors[i % colors.length];
    return `
    <div class="card3d ${revealed?'flipped':''} aspect-[3/4]">
      <div class="card-inner">
        <div class="face shadow" style="background:${c}">
          <div class="text-4xl">🃏</div><p class="font-bold text-white mt-2">${p.name}</p><p class="text-white/80 text-xs mt-1">${p.answer ? '已作答' : '等待中...'}</p>
        </div>
        <div class="face back bg-white shadow">
          <p class="text-xs opacity-60">${p.name} 的答案</p><p class="text-xl font-bold mt-2 break-words">${p.answer || '未作答'}</p>
        </div>
      </div>
    </div>`;
  }).join('');
}

// 進頁面如果網址有 ?room= 自動填入
window.onload = ()=>{
  const r = new URLSearchParams(location.search).get('room');
  if(r) document.getElementById('joinCode').value = r.toUpperCase();
};
</script>
</body>
</html>
