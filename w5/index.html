<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端心電感應 | 多人默契遊戲</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Confetti 慶祝特效 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- 雲端字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            morandi: {
              bg: '#F7F5F0',        // 柔和燕麥白
              card: '#FFFFFF',      // 卡片白
              slate: '#8DA4B4',     // 莫蘭迪灰藍
              rose: '#C89B8C',      // 莫蘭迪粉玫瑰
              sage: '#8B9B90',      // 莫蘭迪鼠尾草綠
              sand: '#E6DFD5',      // 莫蘭迪沙色
              muted: '#94A3B8',     // 靜謐灰
              dark: '#4A5568'       // 深石灰文字
            }
          },
          fontFamily: {
            sans: ['"Zen Maru Gothic"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #F7F5F0;
      color: #4A5568;
    }
    /* 3D 翻牌動畫相關 CSS */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    .card-inner {
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-flipped {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-morandi-rose selection:text-white">

  <!-- 頂部導覽列 -->
  <header class="w-full bg-white/70 backdrop-blur-md border-b border-morandi-sand sticky top-0 z-40 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">✨</span>
        <h1 class="text-xl font-bold tracking-wide text-morandi-dark">雲端心電感應</h1>
        <span id="room-badge" class="hidden text-xs bg-morandi-sand/60 text-morandi-dark px-2.5 py-1 rounded-full font-medium">
          房間：<span id="display-room-id">----</span>
        </span>
      </div>

      <!-- 右側控制項與隱藏房主按鈕 -->
      <div class="flex items-center space-x-3">
        <!-- 隱藏房主開關按鈕 (點擊切換房主權限) -->
        <button id="secret-host-toggle" title="隱藏房主控制開關" class="p-2 text-morandi-muted hover:text-morandi-rose transition-colors duration-200 rounded-full hover:bg-morandi-sand/30">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
          </svg>
        </button>
        <div id="user-profile-badge" class="hidden flex items-center space-x-2 text-sm text-morandi-dark bg-morandi-bg px-3 py-1.5 rounded-full border border-morandi-sand">
          <span class="w-2 h-2 rounded-full bg-morandi-sage animate-pulse"></span>
          <span id="display-user-name" class="font-medium">玩家</span>
          <span id="host-indicator" class="hidden text-xs bg-morandi-rose text-white px-1.5 py-0.5 rounded font-bold">房主</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6">

    <!-- 1. 登入 / 大廳頁面 -->
    <section id="login-view" class="max-w-md mx-auto mt-8 bg-white rounded-3xl p-8 shadow-sm border border-morandi-sand">
      <div class="text-center mb-6">
        <div class="inline-block p-4 rounded-full bg-morandi-bg text-4xl mb-3">🔮</div>
        <h2 class="text-2xl font-bold text-morandi-dark">進入默契考驗</h2>
        <p class="text-sm text-morandi-muted mt-1">輸入名字與房間代碼即可加入對戰</p>
      </div>

      <form id="join-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-morandi-muted mb-1">您的暱稱</label>
          <input type="text" id="input-username" required placeholder="例如：小明" class="w-full px-4 py-3 rounded-xl bg-morandi-bg border border-morandi-sand focus:outline-none focus:ring-2 focus:ring-morandi-slate transition">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-morandi-muted mb-1">房間代碼 (4位數)</label>
          <input type="text" id="input-roomid" required placeholder="例如：8888" maxlength="6" class="w-full px-4 py-3 rounded-xl bg-morandi-bg border border-morandi-sand focus:outline-none focus:ring-2 focus:ring-morandi-slate uppercase font-mono transition">
        </div>
        <div class="pt-2 flex gap-3">
          <button type="submit" class="flex-1 bg-morandi-slate hover:bg-morandi-dark text-white font-medium py-3 rounded-xl transition shadow-sm active:scale-95">
            加入遊戲
          </button>
          <button type="button" id="quick-create-btn" class="bg-morandi-sand hover:bg-morandi-rose hover:text-white text-morandi-dark font-medium px-4 py-3 rounded-xl transition active:scale-95">
            隨機開房
          </button>
        </div>
      </form>
    </section>

    <!-- 2. 遊戲房間頁面
