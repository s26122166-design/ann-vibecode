<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？</title>
    <!-- 確實載入外部 CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- 確實使用 defer 載入外部 JS -->
    <script src="script.js" defer></script>
</head>
<body>
    <div class="card-container">
        <!-- 大標題 -->
        <h1 id="title">今天吃什麼？</h1>
        
        <!-- 抽籤後才會顯示的區域 (圖片與地圖按鈕) -->
        <div id="result-area" style="display: none;">
            <img id="food-photo" src="" alt="美食照片">
            <br>
            <a id="map-btn" href="" target="_blank" class="btn map-btn">馬上出發 🚗</a>
        </div>
        
        <!-- 抽籤大按鈕 -->
        <button id="draw-btn" class="btn draw-btn">點我抽籤 🎲</button>
    </div>
</body>
</html>
