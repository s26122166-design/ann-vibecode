<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什麼？隨心抽籤機 ☕</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Zen Maru Gothic & Noto Sans TC (圓潤輕鬆的文青字體) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* 休閒輕鬆風：溫潤燕麥奶背景 */
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #F5F2EB;
      background-image: radial-gradient(circle at 50% 0%, #FAF8F5 0%, #EFECE4 100%);
      color: #3E3A35;
    }

    .font-casual {
      font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
    }

    /* 柔和 Q 彈動畫 (保留彈跳感，但更輕盈自然) */
    @keyframes softBounce {
      0% { transform: scale(0.75); opacity: 0; }
      55% { transform: scale(1.08); opacity: 1; }
      80% { transform: scale(0.97); }
      100% { transform: scale(1); }
    }

    .animate-soft-bounce {
      animation: softBounce 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 悠閒微漂浮動畫 */
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .animate-float {
      animation: gentleFloat 3s ease-in-out infinite;
    }

    /* 焦糖陶土橘按鈕 (溫暖有食慾、不刺眼) */
    .btn-terracotta {
      background-color: #D47A53;
      box-shadow: 0 8px 20px -4px rgba(212, 122, 83, 0.4);
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .btn-terracotta:hover {
      background-color: #C56B44;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -4px rgba(212, 122, 83, 0.45);
    }
    .btn-terracotta:active {
      transform: translateY(1px);
      box-shadow: 0 4px 12px -2px rgba(212, 122, 83, 0.35);
    }

    /* 鼠尾草綠按鈕 (散步出發感) */
    .btn-sage {
      background-color: #6E8B74;
      box-shadow: 0 8px 20px -4px rgba(110, 139, 116, 0.35);
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .btn-sage:hover {
      background-color: #5E7A64;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -4px rgba(110, 139, 116, 0.4);
    }
    .btn-sage:active {
      transform: translateY(1px);
    }

    /* 隱藏滾動條 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-5 sm:p-8">

  <!-- 頁面主容器 -->
  <div class="w-full max-w-md mx-auto my-auto">
    
    <!-- Header 區塊 -->
    <header class="text-center mb-7">
      <div class="inline-flex items-center gap-2 bg-[#EBE5D8] text-[#7A7062] px-4 py-1.5 rounded-full text-xs font-medium tracking-wide mb-4">
        <span>☕</span>
        <span>慢活食光・隨心選餐</span>
      </div>

      <!-- 動態替換標題區域 -->
      <div id="title-wrapper" class="py-1">
        <h1 id="main-title" class="font-casual text-3xl sm:text-4xl font-bold text-[#3E3A35] tracking-wide flex items-center justify-center gap-2.5">
          <span class="inline-block animate-float">🍽️</span>
          <span id="title-text">今天吃什麼？</span>
        </h1>
        <p id="sub-title" class="text-[#857D70] text-sm mt-2.5 font-normal">
          放輕鬆，交給直覺幫你決定下一餐吧
        </p>
      </div>
    </header>

    <!-- 主要互動白卡片 (加大留白與柔和邊框) -->
    <main class="bg-[#FCFBF9] border border-[#E6E0D4] rounded-[2rem] p-7 sm:p-8 shadow-[0_16px_40px_rgba(62,58,53,0.06)] relative">

      <!-- 階段一：等待抽籤 / 跑馬燈滾動區 -->
      <div id="slot-display-section" class="flex flex-col items-center">
        
        <!-- 跑馬燈顯示框 -->
        <div class="w-full bg-[#F5F2EB] border border-[#E6E0D4] rounded-2xl p-7 mb-7 text-center flex flex-col items-center justify-center min-h-[148px]">
          <span class="text-[#A39B8E] text-[11px] font-medium tracking-widest uppercase mb-2">
            TODAY'S MENU
          </span>
          
          <div id="candidate-display" class="font-casual text-2xl sm:text-3xl font-bold text-[#4A453E] transition-all">
            🌿 準備好了嗎？
          </div>
          <div id="spinning-hint" class="text-xs text-[#9C8F7E] mt-2.5 hidden">
            慢慢挑，看看今天跟哪道美食有緣...
          </div>
        </div>

        <!-- 主按鈕：「點我抽籤」 -->
        <button id="draw-btn" class="btn-terracotta w-full text-white font-casual text-xl sm:text-2xl py-4 px-6 rounded-2xl flex items-center justify-center gap-2.5 font-bold cursor-pointer">
          <span>點我抽籤</span>
          <span class="text-xl">🎲</span>
        </button>
      </div>

      <!-- 階段二：抽籤結果展示卡片 -->
      <div id="result-card-section" class="hidden flex-col items-center text-center">
        
        <span class="bg-[#F2EBE1] text-[#8C6D4F] font-medium text-xs px-3.5 py-1 rounded-full mb-3 inline-flex items-center gap-1.5">
          <span>✨</span> 今日推薦好味道
        </span>

        <!-- 店名標題 -->
        <h2 id="result-food-name" class="font-casual text-2xl sm:text-3xl font-bold text-[#3E3A35] mb-4 tracking-wide">
          --
        </h2>

        <!-- 美食相片卡 -->
        <div class="relative w-full h-48 sm:h-52 rounded-2xl overflow-hidden mb-4 border border-[#E6E0D4] bg-[#F5F2EB] group">
          <img id="result-food-img" src="" alt="美食照片" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" onerror="this.src='https://placehold.co/600x400/E6E0D4/7A7062?text=Delicious+Food'">
          
          <!-- 圖片左下角分類標籤 -->
          <div class="absolute bottom-3 left-3 bg-[#3E3A35]/75 backdrop-blur-sm text-[#FAF8F5] text-xs font-medium px-3 py-1 rounded-full">
            <span id="result-food-tag">🍜 推薦美食</span>
          </div>
        </div>

        <!-- 簡短特色敘述 -->
        <p id="result-food-desc" class="text-[#6E675F] text-sm mb-6 px-2 leading-relaxed">
          --
        </p>

        <!-- 操作按鈕群：馬上出發 & 再抽一次 -->
        <div class="w-full flex flex-col gap-3">
          <!-- 「馬上出發」 Google Maps 連結按鈕 -->
          <a id="map-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn-sage w-full text-white font-casual font-bold text-lg py-3.5 px-6 rounded-2xl flex items-center justify-center gap-2 no-underline">
            <i class="fa-solid fa-location-dot"></i>
            <span>馬上出發</span>
          </a>

          <!-- 「再抽一次」按鈕 -->
          <button id="retry-btn" class="w-full bg-transparent hover:bg-[#F2EFE9] text-[#7A7062] font-medium text-sm py-2.5 px-5 rounded-xl border border-[#DFD9CE] transition-colors flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa-solid fa-rotate-right text-xs"></i>
            <span>換個口味，再抽一次</span>
          </button>
        </div>

      </div>

    </main>

    <!-- 籤筒管理展開按鈕 -->
    <div class="mt-5 text-center">
      <button id="toggle-list-btn" class="text-xs font-medium text-[#7A7062] hover:text-[#3E3A35] bg-[#EBE5D8]/70 hover:bg-[#EBE5D8] px-4 py-2 rounded-full transition-all inline-flex items-center gap-2 cursor-pointer">
        <i class="fa-solid fa-sliders text-[11px]"></i>
        <span>查看 / 調整口袋名單 (5 家)</span>
        <i id="toggle-icon" class="fa-solid fa-chevron-down text-[10px] transition-transform duration-200"></i>
      </button>
    </div>

    <!-- 展開選單區 -->
    <div id="list-modal" class="hidden mt-3 bg-[#FCFBF9] rounded-2xl p-5 border border-[#E6E0D4] shadow-sm text-xs">
      <div class="flex items-center justify-between font-medium text-[#5C554B] pb-3 mb-3 border-b border-[#EFECE4]">
        <span>📋 目前的口袋名單</span>
        <span id="food-count-badge" class="bg-[#F2EBE1] text-[#8C6D4F] px-2.5 py-0.5 rounded-full">5 家店</span>
      </div>

      <!-- 預設店家清單 -->
      <ul id="food-list-container" class="grid grid-cols-1 gap-2 max-h-48 overflow-y-auto no-scrollbar">
        <!-- 由 JavaScript 動態填入 -->
      </ul>

      <!-- 自訂新增店家輸入框 -->
      <div class="mt-3 pt-3 border-t border-[#EFECE4] flex gap-2">
        <input id="new-food-input" type="text" placeholder="輸入想吃的店名..." class="w-full px-3.5 py-2 bg-[#F5F2EB] border border-[#E6E0D4] rounded-xl text-xs text-[#3E3A35] placeholder-[#A39B8E] focus:outline-none focus:border-[#D47A53]">
        <button id="add-food-btn" class="bg-[#D47A53] hover:bg-[#C56B44] text-white font-medium px-4 py-2 rounded-xl shrink-0 transition-colors cursor-pointer">
          新增
        </button>
      </div>
    </div>

  </div>

  <!-- 頁尾 -->
  <footer class="mt-8 text-center text-xs text-[#9C9488]">
    <p>願你今天有個悠閒愉快的用餐時光 🍵</p>
  </footer>

  <!-- 核心 JavaScript 程式邏輯 -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      // 預設指定抽籤資料庫
      const defaultFoods = [
        {
          name: "深水食堂",
          tag: "🍱 日式定食・丼飯",
          image: "https://i.postimg.cc/qMzF9dHY/unnamed.webp",
          query: "深水食堂",
          desc: "熱騰騰的日式定食與香甜大碗丼飯，帶來溫飽又滿足的幸福感。"
        },
        {
          name: "石二鍋 高雄新楠萬家福店",
          tag: "🍲 暖胃石頭火鍋",
          image: "https://i.postimg.cc/8C6J3cZS/unnamed-(3).webp",
          query: "石二鍋",
          desc: "新鮮蔬菜盤搭配清甜石頭湯頭，慢慢涮肉最療癒了。"
        },
        {
          name: "娜娜法國麵包",
          tag: "🥖 越式法包・輕食",
          image: "https://i.postimg.cc/HcLgzhBq/unnamed-(5).webp",
          query: "娜娜法國麵包",
          desc: "外皮酥脆、內餡爽口，配上酸甜醃蘿蔔，輕鬆無負擔的美味。"
        },
        {
          name: "顔記豆莊",
          tag: "🍳 傳統早點・現煎蛋餅",
          image: "https://i.postimg.cc/MGTtj7ZM/unnamed-(2).webp",
          query: "豆莊",
          desc: "香濃現磨豆漿配上一份古早味蛋餅，享受簡單純粹的好味道。"
        },
        {
          name: "永吉炒飯",
          tag: "🍚 鑊氣十足炒飯",
          image: "https://i.postimg.cc/VLCxJcZf/unnamed-(4).webp",
          query: "炒飯",
          desc: "粒粒分明、香氣四溢的家常炒飯，經典樸實卻最耐吃。"
        }
      ];

      let currentFoodList = [...defaultFoods];
      let isSpinning = false;

      // DOM 元素抓取
      const drawBtn = document.getElementById('draw-btn');
      const retryBtn = document.getElementById('retry-btn');
      const slotDisplaySection = document.getElementById('slot-display-section');
      const resultCardSection = document.getElementById('result-card-section');
      
      const mainTitle = document.getElementById('main-title');
      const titleText = document.getElementById('title-text');
      const subTitle = document.getElementById('sub-title');
      
      const candidateDisplay = document.getElementById('candidate-display');
      const spinningHint = document.getElementById('spinning-hint');
      
      const resultFoodName = document.getElementById('result-food-name');
      const resultFoodImg = document.getElementById('result-food-img');
      const resultFoodTag = document.getElementById('result-food-tag');
      const resultFoodDesc = document.getElementById('result-food-desc');
      const mapBtn = document.getElementById('map-btn');

      const toggleListBtn = document.getElementById('toggle-list-btn');
      const toggleIcon = document.getElementById('toggle-icon');
      const listModal = document.getElementById('list-modal');
      const foodListContainer = document.getElementById('food-list-container');
      const foodCountBadge = document.getElementById('food-count-badge');
      const newFoodInput = document.getElementById('new-food-input');
      const addFoodBtn = document.getElementById('add-food-btn');

      // 輕柔木琴滴答聲 (降低音量與頻率，聽起來更放鬆)
      function playSoftTick() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320 + Math.random() * 80, ctx.currentTime);
          gain.gain.setValueAtTime(0.03, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } catch (e) {}
      }

      // 溫暖和弦提示音
      function playRelaxedChime() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const freqs = [261.63, 329.63, 392.00, 493.88]; // Cmaj7 溫暖和弦
          freqs.forEach((freq, index) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + index * 0.1);
            gain.gain.setValueAtTime(0.07, ctx.currentTime + index * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + index * 0.1 + 0.45);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + index * 0.1);
            osc.stop(ctx.currentTime + index * 0.1 + 0.45);
          });
        } catch (e) {}
      }

      // 渲染口袋名單列表
      function renderFoodList() {
        foodListContainer.innerHTML = '';
        foodCountBadge.textContent = `${currentFoodList.length} 家店`;
        toggleListBtn.querySelector('span').textContent = `查看 / 調整口袋名單 (${currentFoodList.length} 家)`;

        currentFoodList.forEach((food, index) => {
          const li = document.createElement('li');
          li.className = 'flex items-center justify-between bg-[#F5F2EB] px-3.5 py-2.5 rounded-xl text-[#4A453E]';
          li.innerHTML = `
            <div class="flex items-center gap-2.5 truncate">
              <span class="w-1.5 h-1.5 rounded-full bg-[#D47A53]"></span>
              <span class="truncate font-medium">${food.name}</span>
            </div>
            ${currentFoodList.length > 2 ? `
              <button data-index="${index}" class="delete-food-btn text-[#A39B8E] hover:text-[#C56B44] px-1.5 py-0.5 rounded transition-colors cursor-pointer" title="移除">
                <i class="fa-solid fa-xmark"></i>
              </button>
            ` : ''}
          `;
          foodListContainer.appendChild(li);
        });

        document.querySelectorAll('.delete-food-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = parseInt(e.currentTarget.getAttribute('data-index'), 10);
            currentFoodList.splice(idx, 1);
            renderFoodList();
          });
        });
      }

      // 展開/收合清單
      toggleListBtn.addEventListener('click', () => {
        listModal.classList.toggle('hidden');
        toggleIcon.classList.toggle('rotate-180');
      });

      // 手動新增店家 (支援按 Enter 鍵新增)
      function handleAddFood() {
        const val = newFoodInput.value.trim();
        if (val) {
          currentFoodList.push({
            name: val,
            tag: "✨ 私房口袋名單",
            image: `https://placehold.co/600x400/E6E0D4/5C554B?text=${encodeURIComponent(val)}`,
            query: val,
            desc: "自己加入的私房好店，今天去重溫這份美味吧！"
          });
          newFoodInput.value = '';
          renderFoodList();
        }
      }

      addFoodBtn.addEventListener('click', handleAddFood);
      newFoodInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleAddFood();
      });

      // 核心抽籤邏輯
      function startDrawProcess() {
        if (isSpinning || currentFoodList.length === 0) return;
        isSpinning = true;

        drawBtn.disabled = true;
        drawBtn.classList.add('opacity-75');
        spinningHint.classList.remove('hidden');

        let speed = 50;
        let counter = 0;
        const maxRolls = 18;
        const winner = currentFoodList[Math.floor(Math.random() * currentFoodList.length)];

        function step() {
          counter++;
          const tempSelection = currentFoodList[Math.floor(Math.random() * currentFoodList.length)];
          candidateDisplay.textContent = tempSelection.name;
          playSoftTick();

          if (counter < maxRolls) {
            if (counter > maxRolls - 6) {
              speed += 50;
            } else if (counter > maxRolls - 11) {
              speed += 20;
            }
            setTimeout(step, speed);
          } else {
            displayWinner(winner);
          }
        }

        step();
      }

      // 呈現抽籤結果
      function displayWinner(food) {
        playRelaxedChime();

        // 大地色系柔和紙花
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 55,
            spread: 65,
            origin: { y: 0.6 },
            colors: ['#D47A53', '#6E8B74', '#E6CCB2', '#DDB892']
          });
        }

        // 1. 柔和彈跳動畫替換大標題
        titleText.textContent = `今天就吃「${food.name}」`;
        mainTitle.classList.remove('animate-soft-bounce');
        void mainTitle.offsetWidth;
        mainTitle.classList.add('animate-soft-bounce');
        subTitle.textContent = `決定好了！現在就出發去享用吧`;

        // 2. 設置結果卡片資訊
        resultFoodName.textContent = food.name;
        resultFoodTag.textContent = food.tag || "🍜 推薦美食";
        resultFoodImg.src = food.image;
        resultFoodImg.alt = food.name;
        resultFoodDesc.textContent = food.desc || "充滿溫度的好味道，祝你用餐愉快！";

        // 3. 設定 Google Maps 搜尋連結
        mapBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(food.query || food.name)}`;

        // 4. 切換顯示區塊
        slotDisplaySection.classList.add('hidden');
        resultCardSection.classList.remove('hidden');
        resultCardSection.classList.remove('animate-soft-bounce');
        void resultCardSection.offsetWidth;
        resultCardSection.classList.add('animate-soft-bounce', 'flex');

        isSpinning = false;
        spinningHint.classList.add('hidden');
        drawBtn.disabled = false;
        drawBtn.classList.remove('opacity-75');
      }

      // 重置狀態
      function resetToMain() {
        mainTitle.classList.remove('animate-soft-bounce');
        titleText.textContent = '今天吃什麼？';
        subTitle.textContent = '放輕鬆，交給直覺幫你決定下一餐吧';

        candidateDisplay.textContent = '🌿 準備好了嗎？';
        
        resultCardSection.classList.add('hidden');
        resultCardSection.classList.remove('animate-soft-bounce', 'flex');
        slotDisplaySection.classList.remove('hidden');
      }

      // 事件綁定
      drawBtn.addEventListener('click', startDrawProcess);
      retryBtn.addEventListener('click', resetToMain);

      // 初始化菜單
      renderFoodList();

    });
  </script>
</body>
</html>
