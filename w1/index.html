<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人數位名片</title>
  <!-- 連結 CSS 樣式檔 -->
  <link rel="stylesheet" href="style.css">
  <!-- 導入 Google 字體（讓文字更有質感） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 名片主體卡片 -->
  <main class="profile-card">
    
    <!-- 1. 大頭貼照片（可替換 src 裡的網址為你自己的照片網址） -->
    <div class="avatar-container">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300" alt="大頭貼" class="avatar">
    </div>

    <!-- 2. 名字與簡短自我介紹 -->
    <h1 class="name">艾莉絲 Alice</h1>
    <p class="bio">✨ UI/UX 設計新手｜用設計記錄美好生活 🌸</p>

    <!-- 3. 社群與聯絡按鈕 -->
    <div class="button-group">
      <!-- 請將 href 裡的網址替換成你的 Instagram 連結 -->
      <a href="https://instagram.com" target="_blank" class="btn btn-instagram">
        Instagram
      </a>
      
      <!-- 請將 href 裡的 mailto: 替換成你的 Email 信箱 -->
      <a href="mailto:your-email@example.com" class="btn btn-email">
        發送 Email
      </a>
    </div>

  </main>

</body>
</html>
