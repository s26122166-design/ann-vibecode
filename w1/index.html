<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阮紅安 Annie｜個人數位名片</title>
    
    <!-- 引入 Google Fonts：圓潤親切的 Zen Maru Gothic 搭配 Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           💡 新手快速換色區：修改這裡的色碼就能換風格
        ========================================== */
        :root {
            --bg-gradient-start: #f7f3eb; /* 燕麥奶淺米色 */
            --bg-gradient-end: #e9efe6;   /* 柔和淺鼠尾草綠 */
            --card-bg: #fffdf9;           /* 溫暖奶油白卡片底色 */
            --text-main: #4e443c;         /* 溫暖深咖啡字色 */
            --text-sub: #7d7268;          /* 柔和拿鐵灰字色 */
            --btn-ig-bg: #e8c5b0;         /* 暖陶土奶茶色 */
            --btn-ig-hover: #dfa98c;      /* 滑鼠移過去的暖橘棕 */
            --btn-email-bg: #c8d8c5;      /* 清新鼠尾草綠 */
            --btn-email-hover: #b2cab0;   /* 滑鼠移過去的森林綠 */
        }

        /* 基礎版面歸零設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 整體頁面置中與背景設定 */
        body {
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            padding: 20px;
        }

        /* 名片卡片外觀與微陰影 */
        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 360px;
            padding: 42px 30px;
            border-radius: 32px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            text-align: center;
            box-shadow: 0 18px 40px rgba(139, 123, 107, 0.12),
                        0 4px 12px rgba(139, 123, 107, 0.05);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .card:hover {
            transform: translateY(-6px);
        }

        /* 圓形大頭貼外框 */
        .avatar-container {
            width: 114px;
            height: 114px;
            margin: 0 auto 20px auto;
            padding: 4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--btn-ig-bg), var(--btn-email-bg));
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--card-bg);
            display: block;
        }

        /* 姓名樣式 */
        .name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
            letter-spacing: 0.8px;
        }

        /* 自我介紹樣式 */
        .bio {
            font-size: 0.95rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* 按鈕排列容器 */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 按鈕通用圓潤造型 */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 13px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(139, 123, 107, 0.08);
        }

        /* Instagram 按鈕配色 */
        .btn-instagram {
            background-color: var(--btn-ig-bg);
        }

        .btn-instagram:hover {
            background-color: var(--btn-ig-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(223, 169, 140, 0.35);
        }

        /* Email 按鈕配色 */
        .btn-email {
            background-color: var(--btn-email-bg);
        }

        .btn-email:hover {
            background-color: var(--btn-email-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(178, 202, 176, 0.35);
        }

        /* 按鈕內圖示大小與間距 */
        .btn svg {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- 名片主體卡片 -->
    <main class="card">
        
        <!-- 1. 圓形大頭貼 -->
        <div class="avatar-container">
            <img class="avatar" src="https://i.postimg.cc/SRLBR6V6/DSC-0147.jpg" alt="阮紅安 Annie 大頭貼">
        </div>

        <!-- 2. 名字與休閒風自我介紹 -->
        <h1 class="name">阮紅安 Annie</h1>
        <p class="bio">☕ UI/UX 設計新手｜喜歡在午後陽光裡收集生活靈感與咖啡香 🌿</p>

        <!-- 3. 聯絡按鈕區 -->
        <div class="buttons-container">
            <!-- Instagram 按鈕 -->
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="btn btn-instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                </svg>
                追蹤 Instagram
            </a>

            <!-- Email 按鈕 -->
            <a href="mailto:hongann@gmail.com" class="btn btn-email">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M0 3v18h24v-18h-24zm21.518 2l-9.518 6.013-9.518-6.013h19.036zm-19.518 14v-11.765l10 6.319 10-6.319v11.765h-20z"/>
                </svg>
                寄信給我
            </a>
        </div>

    </main>

</body>
</html>
