<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 ☕</title>
  
  <!-- 引入圓潤休閒風格字型 (Zen Maru Gothic 圓體 & Noto Sans TC) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- 引入 FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* =========================================================
       🎨【色彩與主題控制區 (CSS Variables) - 休閒輕鬆風】
       想換成其他色系（如天空藍、奶茶色），直接修改這裡的色碼即可！
       ========================================================= */
    :root {
      /* 🌿 頁面背景：燕麥奶白到鼠尾草淡綠的療癒漸層 */
      --bg-gradient-start: #FCF9F2;
      --bg-gradient-mid:   #F3F7F0;
      --bg-gradient-end:   #EBF2E8;
      
      /* ✏️ 文字顏色：溫潤深可可灰與柔霧灰（比純黑更不刺眼） */
      --text-main: #434A42;
      --text-sub:  #7D877B;

      /* 🃏 卡片外觀：純白微透紙張質感 + 柔和陰影 */
      --card-bg:     rgba(255, 255, 255, 0.92);
      --card-border: #EAE6DC;
      --card-shadow: 0 10px 28px rgba(95, 111, 92, 0.07);

      /* 💡【隨時間輪播：亮起聚焦特效 (Highlight) 顏色控制】 */
      --highlight-border: #F4A261;                  /* 聚焦卡片邊框色：暖陽蜜糖橘 */
      --highlight-glow:   rgba(244, 162, 97, 0.38); /* 聚焦卡片外發光暈影 */
      --highlight-badge:  #7FB069;                  /* 聚焦小標籤背景色：清新嫩葉綠 */

      /* 🎨 頭像馬卡龍粉彩配色庫 (Pastel Palette) */
      --avatar-color-1: #FFD6BA; /* 蜜桃奶霜 */
      --avatar-color-2: #D8E2DC; /* 晨霧薄荷 */
      --avatar-color-3: #FFE5D9; /* 杏仁粉橘 */
      --avatar-color-4: #E2ECE9; /* 蘇打淡藍 */
      --avatar-color-5: #FDE4CF; /* 焦糖布丁 */
    }

    /* 修正全域盒模型設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 3rem 1.2rem 4.5rem 1.2rem;
      position: relative;
      overflow-x: hidden;
    }

    /* ☁️ 背景漂浮柔和光暈裝飾（增加休閒空氣感，不影響點擊） */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.55;
    }
    .blob-1 {
      width: 340px;
      height: 340px;
      background: #FDE4CF;
      top: -80px;
      left: -80px;
    }
    .blob-2 {
      width: 400px;
      height: 400px;
      background: #D8E2DC;
      bottom: -100px;
      right: -80px;
    }

    /* 頁面標題區域 */
    header {
      text-align: center;
      margin-bottom: 2.6rem;
    }

    .header-pill {
      display: inline-block;
      background: rgba(127, 176, 105, 0.15);
      color: #588157;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 0.8rem;
      letter-spacing: 1px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #3A4239;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.5rem;
      letter-spacing: 1.5px;
    }

    header h1 i {
      color: var(--highlight-border);
    }

    header p {
      color: var(--text-sub);
      font-size: 1rem;
    }

    /* 狀態顯示列 (顯示目前輪播進度與互動提示) */
    .status-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 1.2rem;
    }

    .status-badge {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid var(--card-border);
      padding: 7px 20px;
      border-radius: 999px;
      font-size: 0.9rem;
      color: var(--text-sub);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .status-badge i {
      color: var(--highlight-badge);
      animation: gentleFloat 2s infinite ease-in-out;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* 主容器 */
    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    /* =========================================================
       🌀【載入中動畫效果】(休閒彈跳氣泡)
       ========================================================= */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5.5rem 0;
      gap: 1.2rem;
    }

    .loading-bubbles {
      display: flex;
      gap: 12px;
    }

    .bubble {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .bubble:nth-child(1) { background-color: #F4A261; animation-delay: -0.32s; }
    .bubble:nth-child(2) { background-color: #7FB069; animation-delay: -0.16s; }
    .bubble:nth-child(3) { background-color: #E9C46A; animation-delay: 0s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.3); opacity: 0.5; }
      40% { transform: scale(1.1); opacity: 1; }
    }

    .loading-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 1.5px;
    }

    /* =========================================================
       🧱【瀑布流排版 (Masonry Layout)】
       ========================================================= */
    .masonry-wall {
      /* 桌機預設 3 欄錯落排列 */
      column-count: 3;
      column-gap: 1.8rem;
      width: 100%;
    }

    /* 平板調整為 2 欄 */
    @media (max-width: 900px) {
      .masonry-wall {
        column-count: 2;
        column-gap: 1.3rem;
      }
    }

    /* 手機調整為 1 欄 */
    @media (max-width: 600px) {
      .masonry-wall {
        column-count: 1;
      }
    }

    /* =========================================================
       💌【留言卡片基礎樣式 - 休閒圓潤便利貼風格】
       ========================================================= */
    .card {
      /* 關鍵設定：防止卡片在瀑布流欄位間被截斷 */
      break-inside: avoid;
      page-break-inside: avoid;
      -webkit-column-break-inside: avoid;

      background: var(--card-bg);
      border-radius: 24px;
      padding: 1.6rem;
      margin-bottom: 1.8rem;
      box-shadow: var(--card-shadow);
      border: 2px solid var(--card-border);
      position: relative;

      /* 柔和彈性的過場動畫 */
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
    }

    /* 卡片頭部：粉彩頭像 + 名字 + 時間 */
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1rem;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 16px; /* 圓角方形比正圓更有手作休閒感 */
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.15rem;
      color: #4A4A4A;
      flex-shrink: 0;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.05);
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-main);
    }

    .timestamp {
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* 卡片內文區域 */
    .card-body {
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.98rem;
      line-height: 1.75;
      color: #4F564E;
      white-space: pre-wrap; /* 保留留言換行與空格 */
      word-break: break-word;
    }

    /* 右上角可愛小裝飾圖示 */
    .quote-icon {
      position: absolute;
      top: 1.3rem;
      right: 1.4rem;
      font-size: 1.2rem;
      color: #E2DFD5;
      transition: color 0.5s ease, transform 0.5s ease;
    }

    /* =========================================================
       ✨【隨時間輪播：放大亮起 (Highlight) 特效】
       ========================================================= */
    /* 被選中的卡片：放大、暖陽邊框發光、層級浮起 */
    .card.highlight {
      transform: scale(1.06) translateY(-6px);
      background: #FFFFFF;
      border-color: var(--highlight-border);
      box-shadow: 0 18px 40px var(--highlight-glow), 0 0 0 4px rgba(244, 162, 97, 0.15);
      z-index: 10;
      opacity: 1 !important;
      filter: blur(0px) !important;
    }

    .card.highlight .quote-icon {
      color: var(--highlight-border);
      transform: rotate(12deg) scale(1.1);
    }

    /* 高亮時右上角出現的休閒小標籤 */
    .card.highlight::after {
      content: "🌿 正在播放";
      position: absolute;
      top: -13px;
      right: 22px;
      background: var(--highlight-badge);
      color: #FFFFFF;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(127, 176, 105, 0.35);
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(6px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 當有卡片高亮時，其他未選中的卡片柔和退後（變暗、微模糊） */
    .masonry-wall.has-highlight .card:not(.highlight) {
      opacity: 0.45;
      filter: blur(1.5px) grayscale(10%);
      transform: scale(0.96);
    }

    /* 滑鼠懸停於卡片時輕輕浮起 */
    .card:hover {
      transform: translateY(-4px);
    }
  </style>
</head>
<body>

  <!-- 背景柔和光暈球 -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <!-- 頁頭標題區 -->
  <header>
    <div class="header-pill">CHILL MESSAGE WALL</div>
    <h1><i class="fa-solid fa-mug-hot"></i> 朋友對我的動態留言板</h1>
    <p>泡杯咖啡，慢慢欣賞大家留給我的暖心悄悄話 🍃</p>
    <div class="status-bar">
      <div class="status-badge" id="carouselStatus">
        <i class="fa-solid fa-seedling"></i> 準備播放留言中...
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <div class="container">
    <!-- 1. 載入中動畫 (預設顯示) -->
    <div id="loading">
      <div class="loading-bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
      </div>
      <div class="loading-text">讀取留言中...</div>
    </div>

    <!-- 2. 瀑布流卡片牆 -->
    <div id="wall" class="masonry-wall"></div>
  </div>

  <script>
    /* =========================================================
       ⚙️【全域參數設定區】(方便後續修改輪播秒數與試算表網址)
       ========================================================= */
    
    // ⏰ 1. 輪播切換間隔時間 (單位：毫秒) -> 3000 = 每 3 秒切換下一張
    const CAROUSEL_INTERVAL_MS = 3000; 

    // 🔗 2. Google 試算表 CSV 發布網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSxyFgX1I2efq0xUtzrnSaYsNd8ZuiYlfLaiTnTLYTO0sGNt1AHoe-ibGRwzpPfRpTrhmHbvb9lvPyS/pub?output=csv';

    // 🎨 3. 頭像隨機馬卡龍背景色彩庫
    const AVATAR_COLORS = [
      '#FFD6BA', '#D8E2DC', '#FFE5D9', '#E2ECE9', '#FDE4CF', '#E9EDC9', '#FAEDCD'
    ];

    let messagesData = [];
    let currentIndex = -1;
    let carouselTimer = null;

    /* =========================================================
       1. 健全的 CSV 解析函式 (妥善處理留言內部的逗號與換行)
       ========================================================= */
    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (insideQuotes) {
          if (char === '"' && nextChar === '"') {
            currentCell += '"'; // 處理雙引號轉義 ("")
            i++; 
          } else if (char === '"') {
            insideQuotes = false; // 結束引號包覆
          } else {
            currentCell += char;
          }
        } else {
          if (char === '"') {
            insideQuotes = true; // 進入引號包覆（內部逗號與換行不會切斷欄位）
          } else if (char === ',') {
            currentRow.push(currentCell.trim());
            currentCell = '';
          } else if (char === '\n' || (char === '\r' && nextChar === '\n')) {
            currentRow.push(currentCell.trim());
            if (currentRow.some(cell => cell.length > 0)) {
              rows.push(currentRow);
            }
            currentRow = [];
            currentCell = '';
            if (char === '\r') i++; 
          } else if (char === '\r') {
            currentRow.push(currentCell.trim());
            if (currentRow.some(cell => cell.length > 0)) {
              rows.push(currentRow);
            }
            currentRow = [];
            currentCell = '';
          } else {
            currentCell += char;
          }
        }
      }

      if (currentCell.length > 0 || currentRow.length > 0) {
        currentRow.push(currentCell.trim());
        if (currentRow.some(cell => cell.length > 0)) {
          rows.push(currentRow);
        }
      }

      return rows;
    }

    /* =========================================================
       2. 使用 fetch() 讀取 Google 試算表資料
       ========================================================= */
    async function fetchMessages() {
      const loadingEl = document.getElementById('loading');

      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) {
          throw new Error(`HTTP 讀取失敗，狀態碼：${response.status}`);
        }

        const csvText = await response.text();
        const parsedRows = parseCSV(csvText);

        // CSV 預設欄位順序：[0] 時間戳記, [1] 名字, [2] 悄悄話
        // 自動略過第一列標題列（若包含「時間」字樣）
        let dataRows = parsedRows;
        if (parsedRows.length > 0 && parsedRows[0][0].includes('時間')) {
          dataRows = parsedRows.slice(1);
        }

        messagesData = dataRows.map(row => ({
          timestamp: row[0] || '剛剛',
          name: row[1] || '熱心朋友',
          message: row[2] || '（這條留言內容空白～）'
        }));

        if (messagesData.length === 0) {
          useFallbackData();
        }

      } catch (error) {
        console.warn('Google 試算表載入失敗，切換為示範資料。原因：', error);
        useFallbackData();
      } finally {
        // 隱藏「讀取留言中...」動畫，渲染瀑布流卡片並啟動輪播
        loadingEl.style.display = 'none';
        renderCards(messagesData);
        startCarousel();
      }
    }

    // 備用防護資料 (避免無網路時畫面空白)
    function useFallbackData() {
      messagesData = [
        { timestamp: '2026/11/23 10:30', name: '小明', message: '最近過得還好嗎？忙完這陣子記得出來喝杯咖啡喘口氣喔！☕' },
        { timestamp: '2026/11/23 11:15', name: '阿傑', message: '週末要不要一起去野餐或走走？天氣這麼好，超適合放空！🌿' },
        { timestamp: '2026/11/23 12:00', name: 'Emma', message: '謝謝你總是這麼耐心聽我分享生活小事，跟你聊天真的很放鬆～✨' },
        { timestamp: '2026/11/23 14:20', name: '神秘路人', message: '悄悄話：不用每天都這麼緊繃，偶爾耍廢一下也是很棒的充電方式！🔋' },
        { timestamp: '2026/11/23 16:45', name: '莉莉', message: '下次聚餐約起來！大家都很想念你做的甜點跟笑話 🍰' }
      ];
    }

    /* =========================================================
       3. 動態生成留言卡片至 DOM
       ========================================================= */
    function renderCards(data) {
      const wallEl = document.getElementById('wall');
      wallEl.innerHTML = '';

      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-index', index);

        // 依序搭配粉彩頭像背景色與名字首字
        const randomColor = AVATAR_COLORS[index % AVATAR_COLORS.length];
        const initial = item.name.trim().charAt(0).toUpperCase() || '👤';

        card.innerHTML = `
          <i class="fa-solid fa-feather-pointed quote-icon"></i>
          <div class="card-header">
            <div class="avatar" style="background-color: ${randomColor};">${escapeHTML(initial)}</div>
            <div class="user-info">
              <div class="user-name">${escapeHTML(item.name)}</div>
              <div class="timestamp">${escapeHTML(item.timestamp)}</div>
            </div>
          </div>
          <div class="card-body">${escapeHTML(item.message)}</div>
        `;

        // 點擊任意卡片可直接聚焦查看該留言
        card.addEventListener('click', () => {
          highlightCard(index);
          resetCarouselTimer();
        });

        wallEl.appendChild(card);
      });
    }

    // HTML 安全轉義 (防止 XSS)
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    /* =========================================================
       4. 隨時間輪播：放大亮起 (Highlight) 特效控制
       ========================================================= */
    function highlightCard(index) {
      const wallEl = document.getElementById('wall');
      const cards = document.querySelectorAll('.card');

      if (cards.length === 0) return;

      // 1. 移除所有卡片的高亮狀態
      cards.forEach(card => card.classList.remove('highlight'));

      // 2. 讓其他未被選中的卡片稍微變暗、變模糊
      wallEl.classList.add('has-highlight');

      // 3. 讓目前選中的卡片放大亮起
      const targetCard = cards[index];
      if (targetCard) {
        targetCard.classList.add('highlight');
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // 4. 更新上方狀態列文字
      const statusEl = document.getElementById('carouselStatus');
      statusEl.innerHTML = `<i class="fa-solid fa-seedling"></i> 悠閒輪播中：第 ${index + 1} / ${cards.length} 則留言`;

      currentIndex = index;
    }

    // 切換至下一張卡片
    function nextSpotlight() {
      if (messagesData.length === 0) return;
      const nextIndex = (currentIndex + 1) % messagesData.length;
      highlightCard(nextIndex);
    }

    // 啟動輪播計時器
    function startCarousel() {
      if (carouselTimer) clearInterval(carouselTimer);
      
      // 載入後先亮起第一張
      nextSpotlight();

      // ⏱️ 每隔 CAROUSEL_INTERVAL_MS (預設 3000 毫秒 = 3 秒) 切換下一張
      carouselTimer = setInterval(nextSpotlight, CAROUSEL_INTERVAL_MS);
    }

    // 重設計時器
    function resetCarouselTimer() {
      clearInterval(carouselTimer);
      carouselTimer = setInterval(nextSpotlight, CAROUSEL_INTERVAL_MS);
    }

    // 💡 貼心互動：滑鼠移到卡片牆上時暫停輪播，方便慢慢閱讀長文
    const wallEl = document.getElementById('wall');
    wallEl.addEventListener('mouseenter', () => {
      if (carouselTimer) clearInterval(carouselTimer);
      const statusEl = document.getElementById('carouselStatus');
      statusEl.innerHTML = `<i class="fa-solid fa-mug-saucer"></i> 細細品味中（移開滑鼠繼續輪播）`;
    });

    wallEl.addEventListener('mouseleave', () => {
      resetCarouselTimer();
    });

    // 網頁載入完成後執行
    window.addEventListener('DOMContentLoaded', fetchMessages);
  </script>
</body>
</html>
