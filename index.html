<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阮紅安的日常作品集 - 2026</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"M PLUS Rounded 1c"', '"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            cozy: {
              bg: '#f7f5f0',          /* 暖米色背景 */
              card: '#ffffff',        /* 卡片白 */
              border: '#e6dfd5',      /* 柔和邊框色 */
              primary: '#6b8e23',     /* 橄欖綠 */
              secondary: '#d4a373',   /* 奶茶棕 */
              accent: '#faedcd',      /* 柔黃色 */
              text: '#4a403a',        /* 咖啡深灰文字 */
              muted: '#8c827b',       /* 次要文字 */
              tag: '#e9edc9',         /* 淺綠標籤 */
            }
          },
          boxShadow: {
            'cozy': '0 4px 20px -2px rgba(212, 163, 115, 0.15)',
            'cozy-hover': '0 8px 25px -4px rgba(107, 142, 35, 0.25)',
          }
        }
      }
    }
  </script>

  <style>
    /* 溫馨背景圓點紋理 */
    .cozy-pattern {
      background-image: radial-gradient(#d4a373 0.75px, transparent 0.75px), radial-gradient(#d4a373 0.75px, #f7f5f0 0.75px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      background-color: #f7f5f0;
    }

    /* 搖晃動畫 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px) rotate(-1deg); }
      40% { transform: translateX(4px) rotate(1deg); }
      60% { transform: translateX(-2px); }
      80% { transform: translateX(2px); }
    }
    .animate-shake {
      animation: shake 0.35s ease-in-out;
    }

    /* 自訂捲軸 */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f7f5f0;
    }
    ::-webkit-scrollbar-thumb {
      background: #d4a373;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-cozy-bg text-cozy-text font-sans h-full min-h-screen cozy-pattern select-none flex flex-col justify-between overflow-x-hidden">

  <!-- Header & Control Bar -->
  <header class="w-full p-4 border-b border-cozy-border bg-white/80 backdrop-blur-md sticky top-0 z-50 flex justify-between items-center px-6 shadow-sm">
    <div class="flex items-center space-x-3">
      <span class="inline-block w-3 h-3 rounded-full bg-cozy-primary"></span>
      <h1 class="font-bold text-sm md:text-base text-cozy-text tracking-wide">
        ☕ 阮紅安的輕鬆日常作品集
      </h1>
    </div>

    <!-- Controls: Sound Toggle -->
    <div class="flex items-center space-x-3 text-xs">
      <button id="audio-toggle" class="px-3 py-1.5 bg-cozy-accent/50 border border-cozy-secondary/50 text-cozy-text hover:bg-cozy-secondary hover:text-white transition-all rounded-full font-medium flex items-center gap-1 shadow-sm">
        🎵 <span id="audio-status">音效: 開啟</span>
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="container mx-auto px-4 py-8 max-w-5xl flex-grow flex flex-col items-center justify-center">

    <!-- Profile Section (Center) -->
    <section class="w-full max-w-xl bg-cozy-card border border-cozy-border p-6 rounded-3xl shadow-cozy mb-10 text-center relative backdrop-blur-md transition-all duration-300 hover:shadow-cozy-hover">
      
      <!-- Avatar -->
      <div class="relative w-28 h-28 mx-auto mb-4 group">
        <div class="absolute inset-0 rounded-full bg-gradient-to-r from-cozy-secondary to-cozy-primary blur-sm opacity-30 group-hover:opacity-60 transition-opacity"></div>
        <img 
          src="https://i.postimg.cc/vZ4sLkcf/IMG-1190.jpg" 
          alt="Avatar" 
          class="relative w-full h-full rounded-full border-4 border-white bg-cozy-accent object-cover shadow-md"
          onerror="this.src='https://placehold.co/120x120/d4a373/ffffff?text=AVATAR'"
        />
        <span class="absolute bottom-0 right-0 bg-cozy-primary text-white text-[11px] font-bold px-2 py-0.5 rounded-full shadow-sm border-2 border-white">Lv.4 成長中</span>
      </div>

      <!-- Player Name -->
      <h2 class="text-2xl md:text-3xl font-bold text-cozy-text tracking-wider mb-1">
        阮紅安
      </h2>
      <p class="text-xs md:text-sm text-cozy-muted font-medium tracking-wide uppercase mb-5">
        🌿 享受生活與寫扣的小日子創造者
      </p>

      <!-- Status Bar Panel -->
      <div class="bg-cozy-bg border border-cozy-border p-4 rounded-2xl text-left space-y-2.5 shadow-inner">
        <div class="flex justify-between items-center text-xs font-bold">
          <span class="text-cozy-primary flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-cozy-primary animate-pulse"></span>
            狀態：靈感滿點中 ✨
          </span>
          <span class="text-cozy-secondary">已完成：4 / 16 週</span>
        </div>

        <!-- Progress Bar (4/16 = 25%) -->
        <div class="w-full h-3.5 bg-cozy-border/60 rounded-full p-0.5 relative overflow-hidden">
          <div class="h-full bg-gradient-to-r from-cozy-secondary to-cozy-primary rounded-full transition-all duration-1000" style="width: 25%;"></div>
        </div>

        <div class="flex justify-between text-[11px] text-cozy-muted font-medium">
          <span>進度：25%</span>
          <span>下一站：第 5 週 (準備解鎖)</span>
        </div>
      </div>
    </section>

    <!-- Notification Toast Box -->
    <div id="toast" class="opacity-0 transition-opacity duration-300 fixed top-20 right-6 z-50 bg-amber-100 border border-amber-300 text-amber-800 px-4 py-2.5 rounded-2xl shadow-lg font-medium text-xs flex items-center gap-2 pointer-events-none">
      <span>💡</span> <span id="toast-msg">此階段還在努力手作中喔！</span>
    </div>

    <!-- Level Cards Grid (4x4 Matrix) -->
    <section class="w-full">
      <div class="flex items-center justify-between mb-4 px-2">
        <h3 class="font-bold text-sm text-cozy-text uppercase flex items-center gap-2">
          <span>🌱</span> 學習散步地圖 (16 週)
        </h3>
        <span class="text-xs text-cozy-muted font-medium">點擊卡片查看作業成果</span>
      </div>

      <!-- Grid Container -->
      <div id="grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Level Cards dynamically injected via JavaScript -->
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="w-full border-t border-cozy-border bg-white/60 py-4 text-center text-xs text-cozy-muted mt-8">
    <p>阮紅安的日常作品集 © 2026 // Keep it cozy & simple ☕</p>
  </footer>

  <!-- JavaScript Code -->
  <script>
    // 溫馨輕柔音效設定
    let audioCtx = null;
    let sfxEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // 輕柔的滑過提示音 (柔和木琴感)
    function playHoverSound() {
      if (!sfxEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    // 輕快清脆的點擊音
    function playClickSound() {
      if (!sfxEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime); // E5
        osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.1); // G5
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {}
    }

    // 溫和的鎖定提示音
    function playLockedSound() {
      if (!sfxEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.setValueAtTime(185, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    // 16 週課程資料
    const levelsData = [
      { week: 1, title: "Week 1 - 數位名片", url: "w1/index.html", unlocked: true },
      { week: 2, title: "Week 2 - 今天吃甚麼?", url: "w2/index.html", unlocked: true },
      { week: 3, title: "Week 3 - 課堂作業 3", url: "w3/index.html", unlocked: true },
      { week: 4, title: "Week 4 - 課堂作業 4", url: "w4/index.html", unlocked: true },
      { week: 5, title: "Week 5 - 課堂作業 5", url: "w5/index.html", unlocked: false },
      { week: 6, title: "Week 6 - 課堂作業 6", url: "w6/index.html", unlocked: false },
      { week: 7, title: "Week 7 - 課堂作業 7", url: "w7/index.html", unlocked: false },
      { week: 8, title: "Week 8 - 期中專案", url: "w8/index.html", unlocked: false },
      { week: 9, title: "Week 9 - 課堂作業 9", url: "w9/index.html", unlocked: false },
      { week: 10, title: "Week 10 - 課堂作業 10", url: "w10/index.html", unlocked: false },
      { week: 11, title: "Week 11 - 課堂作業 11", url: "w11/index.html", unlocked: false },
      { week: 12, title: "Week 12 - 課堂作業 12", url: "w12/index.html", unlocked: false },
      { week: 13, title: "Week 13 - 課堂作業 13", url: "w13/index.html", unlocked: false },
      { week: 14, title: "Week 14 - 課堂作業 14", url: "w14/index.html", unlocked: false },
      { week: 15, title: "Week 15 - 課堂作業 15", url: "w15/index.html", unlocked: false },
      { week: 16, title: "Week 16 - 期末專案", url: "w16/index.html", unlocked: false },
    ];

    // 顯示提示訊息
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2000);
    }

    // 渲染卡片網格
    function renderGrid() {
      const grid = document.getElementById('grid-container');
      grid.innerHTML = '';

      levelsData.forEach(level => {
        const card = document.createElement('div');
        
        if (level.unlocked) {
          // 已解鎖卡片樣式
          card.className = `
            relative bg-cozy-card border border-cozy-border p-4 rounded-2xl 
            shadow-sm hover:shadow-cozy-hover hover:border-cozy-primary 
            transition-all duration-300 transform hover:-translate-y-1 
            cursor-pointer flex flex-col justify-between h-36 group
          `;

          card.innerHTML = `
            <div class="flex justify-between items-start">
              <span class="text-xs font-bold text-cozy-primary bg-cozy-tag px-2.5 py-1 rounded-full">
                W${level.week}
              </span>
              <span class="text-[11px] bg-cozy-primary/10 text-cozy-primary font-bold px-2 py-0.5 rounded-full">
                已解鎖 ✨
              </span>
            </div>
            
            <div class="my-2">
              <h4 class="font-bold text-sm md:text-base text-cozy-text group-hover:text-cozy-primary transition-colors line-clamp-2">
                ${level.title}
              </h4>
            </div>

            <div class="flex justify-between items-center text-xs text-cozy-secondary font-medium">
              <span>輕鬆散步中</span>
              <span class="group-hover:translate-x-1 transition-transform">前往觀看 ➔</span>
            </div>
          `;

          card.addEventListener('mouseenter', () => playHoverSound());
          card.addEventListener('click', () => {
            playClickSound();
            setTimeout(() => {
              window.location.href = level.url;
            }, 150);
          });

        } else {
          // 未解鎖卡片樣式
          card.className = `
            relative bg-cozy-bg/60 border border-cozy-border/60 p-4 rounded-2xl 
            opacity-60 hover:opacity-90 transition-all duration-200 
            cursor-not-allowed flex flex-col justify-between h-36 group select-none
          `;

          card.innerHTML = `
            <div class="flex justify-between items-start">
              <span class="text-xs font-medium text-cozy-muted bg-cozy-border/50 px-2.5 py-1 rounded-full">
                W${level.week}
              </span>
              <span class="text-xs">🔒</span>
            </div>

            <div class="my-2">
              <h4 class="font-medium text-sm text-cozy-muted">
                ${level.title}
              </h4>
            </div>

            <div class="flex justify-between items-center text-xs text-cozy-muted">
              <span>尚未解鎖</span>
              <span>敬請期待</span>
            </div>
          `;

          // 懸停與點擊提示
          card.addEventListener('mouseenter', () => {
            playLockedSound();
            card.classList.add('animate-shake');
            setTimeout(() => card.classList.remove('animate-shake'), 350);
          });

          card.addEventListener('click', (e) => {
            e.preventDefault();
            playLockedSound();
            card.classList.add('animate-shake');
            showToast(`第 ${level.week} 週還在努力手作中，敬請期待喔！🍵`);
            setTimeout(() => card.classList.remove('animate-shake'), 350);
          });
        }

        grid.appendChild(card);
      });
    }

    // 音效開關切換
    document.getElementById('audio-toggle').addEventListener('click', () => {
      sfxEnabled = !sfxEnabled;
      const audioStatus = document.getElementById('audio-status');
      audioStatus.innerText = sfxEnabled ? '音效: 開啟' : '音效: 關閉';
      if (sfxEnabled) playClickSound();
    });

    // 初始化頁面
    window.addEventListener('DOMContentLoaded', () => {
      renderGrid();
    });
  </script>
</body>
</html>
